[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-catalog-report"
version = "1.0.0"
description = "Documentação de esquemas SQLite em JSON, Markdown e Mermaid, sem exportar registros."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Contribuidores da LOFRANO TECNOLOGIA"}]
keywords = ["sqlite", "schema", "catalog", "documentation", "mermaid", "database"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Documentation",
]

[project.optional-dependencies]
dev = ["build==1.6.1", "setuptools==84.2.1"]

[project.urls]
Homepage = "https://lofranotecnologia.com.br"
Repository = "https://github.com/martinlofranodeoliveira/sqlite-catalog-report"
Issues = "https://github.com/martinlofranodeoliveira/sqlite-catalog-report/issues"
Documentation = "https://github.com/martinlofranodeoliveira/sqlite-catalog-report#readme"

[project.scripts]
sqlite-catalog-report = "sqlite_catalog_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
